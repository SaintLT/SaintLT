<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SaintLT, Software Developer &amp; Engineer</title>
  <desc id="d">Dark banner with the name SaintLT, the title Software Developer and Engineer, and a network hop path ending in a glowing blue node.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#151C26" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#268BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#268BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#268BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#268BFF"/>
      <stop offset="1" stop-color="#268BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="14" fill="#0B0F14"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="13.5" fill="none" stroke="#1F2733"/>

  <!-- name and title -->
  <text x="72" y="150" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">SaintLT</text>
  <text x="74" y="198" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#268BFF">Software Developer &amp; Engineer</text>
  <text x="74" y="238" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#8B98A9">Systems, networks and the software built on top of them.</text>

  <!-- hop path -->
  <circle cx="1090" cy="150" r="90" fill="url(#glow)"/>
  <polyline points="700,222 790,160 880,200 980,118 1090,150" fill="none" stroke="#268BFF" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#0B0F14" stroke="#268BFF" stroke-opacity="0.7" stroke-width="2">
    <circle cx="700" cy="222" r="6"/>
    <circle cx="790" cy="160" r="6"/>
    <circle cx="880" cy="200" r="6"/>
    <circle cx="980" cy="118" r="6"/>
  </g>
  <circle cx="1090" cy="150" r="20" fill="none" stroke="#268BFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="1090" cy="150" r="9" fill="#268BFF"/>

  <!-- bottom accent -->
  <rect x="72" y="316" width="1056" height="2" fill="url(#edge)"/>
</svg>
